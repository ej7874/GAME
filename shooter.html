<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NOVA STRIKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#03030a;overflow:hidden;touch-action:none;user-select:none}
  canvas{display:block;cursor:crosshair}
  #menu{position:fixed;top:10px;left:50%;transform:translateX(-50%);font:700 11px 'Orbitron',sans-serif;letter-spacing:2px;color:#9fd3ff;text-decoration:none;padding:5px 12px;border:1px solid rgba(76,201,255,.35);border-radius:20px;background:rgba(5,10,30,.5);opacity:.6;transition:.2s}
  #menu:hover{opacity:1;box-shadow:0 0 14px #4cc9ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="menu" href="index.html">◀ MENU</a>
<script>
'use strict';
// ================================================================
//  NOVA STRIKER — 다이나믹 우주 슈팅
// ================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, bgGrad, vignette;
const F = "'Orbitron','Segoe UI',sans-serif";
const FK = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#04031a'); bgGrad.addColorStop(0.6, '#0a0526'); bgGrad.addColorStop(1, '#120318');
  const vc = document.createElement('canvas'); vc.width = W; vc.height = H;
  const vg = vc.getContext('2d');
  const gr = vg.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,10,0.75)');
  vg.fillStyle = gr; vg.fillRect(0, 0, W, H);
  vignette = vc;
  if (player) { player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 20, H - 20); }
}

// ---------- utils ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const ease = {
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
};
function poly(p) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); }

// glow sprite cache (빠른 발광 효과)
const glowCache = {};
function glow(col) {
  if (glowCache[col]) return glowCache[col];
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, col); gr.addColorStop(0.5, col + '55'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  return glowCache[col] = c;
}
function drawGlow(x, y, r, col, a = 1) { if (r <= 0) return; ctx.globalAlpha = a; ctx.drawImage(glow(col), x - r, y - r, r * 2, r * 2); }

// ---------- audio ----------
let AC = null, master = null, muted = false, noiseBuf = null, lastShootSnd = 0, lastHitSnd = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type = 'square', vol = 0.2, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.4, freq = 1200) {
  if (!AC || muted) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  shoot() { const n = performance.now(); if (n - lastShootSnd < 80) return; lastShootSnd = n; tone(1200, 400, 0.05, 'square', 0.025); },
  hit() { const n = performance.now(); if (n - lastHitSnd < 40) return; lastHitSnd = n; tone(320, 140, 0.04, 'sawtooth', 0.04); },
  boom(s = 1) { noise(0.35 + s * 0.25, Math.min(0.7, 0.25 + s * 0.15), 700 + s * 500); tone(140, 30, 0.3 + s * 0.15, 'sine', Math.min(0.5, 0.2 + s * 0.1)); },
  power() { tone(400, 1600, 0.2, 'triangle', 0.18); tone(800, 2400, 0.2, 'triangle', 0.14, 0.08); },
  hurt() { noise(0.6, 0.6, 2500); tone(220, 40, 0.6, 'sawtooth', 0.25); },
  warn() { for (let i = 0; i < 3; i++) { tone(520, 520, 0.22, 'square', 0.1, i * 0.5); tone(390, 390, 0.22, 'square', 0.1, i * 0.5 + 0.25); } },
  bomb() { noise(1.4, 0.8, 3000); tone(80, 20, 1.2, 'sine', 0.5); tone(1800, 60, 0.8, 'sawtooth', 0.12); },
  start() { [440, 554, 659, 880].forEach((f, i) => tone(f, f * 1.01, 0.15, 'square', 0.08, i * 0.07)); },
};

// ---------- input ----------
const keys = {};
const mouse = { x: 0, y: 0, active: false, touch: false };
let paused = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  initAudio();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyX' || e.code === 'KeyB' || e.code === 'ShiftLeft') useBomb();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'play') startClick();
});
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; mouse.touch = e.pointerType === 'touch'; });
cv.addEventListener('pointerdown', e => {
  initAudio();
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.touch = e.pointerType === 'touch';
  if (state === 'play' && mouse.touch && Math.hypot(e.clientX - (W - 60), e.clientY - (H - 70)) < 44) { useBomb(); return; }
  mouse.active = true;
  if (e.button === 2) { useBomb(); return; }
  if (state !== 'play') startClick();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { if (state === 'play') paused = true; });

// ---------- state ----------
let state = 'title', stateT = 0, T = 0;
let player = null, pBullets = [], eBullets = [], enemies = [], parts = [], rings = [], popups = [], items = [], debris = [];
let score = 0, dispScore = 0, combo = 0, comboT = 0, comboPulse = 0, wave = 0, wctl = null, banner = null, boss = null;
let shakeAmt = 0, flashA = 0, flashCol = '#ffffff', timeScale = 1, slowT = 0, hitstop = 0, warp = 0, warpTarget = 0;
let deadT = 0, bombT = 0, newRecord = false, bossHpDisp = 1, demo = { x: 0, y: 0, vx: 0, vy: 0, tilt: 0, inv: 0, shield: 0, muzzle: 0 };
let best = 0;
try { best = +localStorage.getItem('novaStrikerBest') || 0; } catch (e) { best = 0; }

function startClick() {
  if (state === 'title' || (state === 'over' && stateT > 1.2)) { newGame(); sfx.start(); }
}

function newGame() {
  player = { x: W / 2, y: H * 0.82, vx: 0, vy: 0, tilt: 0, lives: 3, bombs: 2, power: 1, inv: 2.5, shield: 0, fireT: 0, misT: 0, muzzle: 0, dead: false };
  pBullets = []; eBullets = []; enemies = []; items = []; popups = []; rings = [];
  score = 0; dispScore = 0; combo = 0; comboT = 0; boss = null; newRecord = false;
  shakeAmt = 0; flashA = 0; timeScale = 1; slowT = 0; hitstop = 0; bombT = 0; paused = false;
  state = 'play'; stateT = 0;
  // 출격 연출
  rings.push({ x: player.x, y: player.y, r: 0, maxR: 220, life: 0.8, max: 0.8, col: '#4cc9ff', w: 6 });
  startWave(1);
}

// ---------- background ----------
const stars = [];
for (let i = 0; i < 240; i++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random() * 0.85 + 0.15 });
const nebulae = [
  { x: 0.2, y: 0.3, r: 0.55, h: 280, vy: 6 },
  { x: 0.8, y: 0.7, r: 0.5, h: 200, vy: 9 },
  { x: 0.5, y: -0.2, r: 0.45, h: 330, vy: 7 },
];
const planet = { x: 0.78, y: 0.25, r: 90, h: 210, ring: true, vy: 10 };

function updateBg(dt) {
  warp = lerp(warp, warpTarget, 1 - Math.exp(-dt * 3));
  const spdMul = 1 + warp * 12;
  for (const s of stars) {
    s.y += (30 + s.z * 220) * spdMul * dt / H;
    if (s.y > 1.05) { s.y -= 1.1; s.x = Math.random(); }
  }
  for (const n of nebulae) {
    n.y += n.vy * (1 + warp * 4) * dt / H;
    if (n.y - n.r > 1.1) { n.y = -n.r - 0.1; n.x = Math.random(); n.h = pick([200, 260, 280, 320, 330, 180]); }
  }
  planet.y += planet.vy * (1 + warp * 3) * dt;
  if (planet.y - planet.r * 2 > H) { planet.y = -planet.r * 2 - rand(100, 600); planet.x = rand(0.1, 0.9); planet.r = rand(50, 130); planet.h = rand(0, 360); planet.ring = Math.random() < 0.6; }
}
planet.y = H * 0.25 || 200;

function drawBg() {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const m = Math.max(W, H);
  for (const n of nebulae) {
    const x = n.x * W, y = n.y * H, r = n.r * m;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `hsla(${n.h},80%,45%,0.16)`); g.addColorStop(0.5, `hsla(${n.h + 30},80%,30%,0.07)`); g.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // planet
  ctx.globalCompositeOperation = 'source-over';
  const px = planet.x * W, py = planet.y, pr = planet.r;
  drawPlanet(px, py, pr);
  // stars
  ctx.globalCompositeOperation = 'lighter';
  const streak = warp * 14;
  for (const s of stars) {
    const x = s.x * W, y = s.y * H, a = 0.25 + s.z * 0.75;
    if (streak > 0.4) {
      ctx.strokeStyle = `rgba(${170 + s.z * 85 | 0},${200 + s.z * 55 | 0},255,${a})`; ctx.lineWidth = s.z * 2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - (4 + s.z * 30) * streak); ctx.stroke();
    } else {
      ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(T * 3 + s.x * 50));
      ctx.fillStyle = s.z > 0.8 ? '#ffffff' : '#9fc4ff';
      const sz = s.z * 2.2; ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
      ctx.globalAlpha = 1;
    }
  }
  ctx.globalAlpha = 1;
}
function drawPlanet(x, y, r) {
  if (y < -r * 3 || y > H + r * 3) return;
  const h = planet.h;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, r * 2.2, hslHex(h, 70, 45), 0.25);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (planet.ring) { ctx.save(); ctx.translate(x, y); ctx.rotate(-0.35); ctx.strokeStyle = `hsla(${h + 40},60%,70%,0.35)`; ctx.lineWidth = r * 0.12; ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * 0.45, 0, Math.PI, TAU); ctx.stroke(); ctx.restore(); }
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, `hsl(${h},60%,62%)`); g.addColorStop(0.6, `hsl(${h + 20},55%,32%)`); g.addColorStop(1, `hsl(${h + 30},60%,10%)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  // bands
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  ctx.globalAlpha = 0.12; ctx.fillStyle = '#fff';
  for (let i = -3; i <= 3; i++) ctx.fillRect(x - r, y + i * r * 0.28 + Math.sin(i) * 4, r * 2, r * 0.07);
  ctx.restore(); ctx.globalAlpha = 1;
  if (planet.ring) { ctx.save(); ctx.translate(x, y); ctx.rotate(-0.35); ctx.strokeStyle = `hsla(${h + 40},60%,75%,0.5)`; ctx.lineWidth = r * 0.12; ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * 0.45, 0, 0, Math.PI); ctx.stroke(); ctx.restore(); }
}
function hslHex(h, s, l) {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0');
  return '#' + f(0) + f(8) + f(4);
}

// ---------- effects ----------
const MAXP = 2600;
function addP(p) { if (parts.length < MAXP) parts.push(p); }
function shake(a) { shakeAmt = Math.min(40, Math.max(shakeAmt, a)); }
function flash(a, col = '#ffffff') { flashA = Math.max(flashA, a); flashCol = col; }
function popup(x, y, text, col = '#fff', size = 18, life = 1) { popups.push({ x, y, text, col, size, life, max: life }); }
function ring(x, y, maxR, col, w = 4, life = 0.5) { rings.push({ x, y, r: 0, maxR, life, max: life, col, w }); }

function sparks(x, y, col, n = 4, spd = 300) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    addP({ t: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.15, 0.35), max: 0.35, size: rand(1, 2.2), col, drag: 0.9 });
  }
}
function explode(x, y, size, col) {
  const n = Math.floor(10 + size * 16);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(120, 560) * Math.sqrt(size);
    addP({ t: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.75), max: 0.75, size: rand(1.5, 3), col: Math.random() < 0.5 ? col : '#ffe9a8', drag: 0.92 });
  }
  for (let i = 0; i < n * 0.6; i++) {
    const a = rand(0, TAU), s = rand(20, 260) * Math.sqrt(size);
    addP({ t: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.35, 0.9), max: 0.9, size: rand(5, 14) * Math.sqrt(size), col: pick([col, '#ff9a3c', '#ffd166']), drag: 0.9 });
  }
  for (let i = 0; i < size * 6; i++) {
    const a = rand(0, TAU), s = rand(10, 90) * size;
    addP({ t: 'smoke', x: x + rand(-8, 8) * size, y: y + rand(-8, 8) * size, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 20, life: rand(0.8, 1.6), max: 1.6, size: rand(8, 18) * size, col: '#000', drag: 0.94 });
  }
  addP({ t: 'flash', x, y, vx: 0, vy: 0, life: 0.22, max: 0.22, size: 70 * size, col: '#fff1c0', drag: 1 });
  ring(x, y, 50 * size + 20, col, 3 + size * 2, 0.45 + size * 0.1);
  if (size > 1.2) ring(x, y, 90 * size, '#ffffff', 2, 0.7);
  for (let i = 0; i < size * 5; i++) {
    const a = rand(0, TAU), s = rand(60, 300) * Math.sqrt(size);
    const k = rand(3, 8) * Math.sqrt(size);
    debris.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: rand(0, TAU), vr: rand(-12, 12), life: rand(0.6, 1.4), max: 1.4, col, pts: [0, -k, k * 0.8, k * 0.6, -k * 0.7, k * 0.4] });
  }
  shake(size * 5);
  sfx.boom(size);
}
function cancelBullets(score = true) {
  for (const b of eBullets) {
    addP({ t: 'dot', x: b.x, y: b.y, vx: rand(-40, 40), vy: rand(-80, -20), life: 0.5, max: 0.5, size: 8, col: '#ffe066', drag: 0.95 });
    if (score) addScore(10);
  }
  eBullets.length = 0;
}

// ---------- scoring ----------
function mult() { return Math.min(8, 1 + Math.floor(combo / 8)); }
function addScore(v) { score += v; }

// ---------- waves ----------
function startWave(n) {
  wave = n;
  const isBoss = n % 5 === 0;
  wctl = { toSpawn: isBoss ? 0 : 5 + Math.floor(n * 1.4), spawnT: 2.4, interval: Math.max(0.85, 2.5 - n * 0.12), boss: isBoss, bossT: isBoss ? 3.4 : 0, cleared: false, clearT: 0 };
  banner = { t: 0, text: isBoss ? 'WARNING' : 'WAVE ' + n, sub: isBoss ? '거대 적함이 접근 중입니다' : pick(['적 편대 출현', '전투 준비', '교전 개시', '전방에 적기 다수']), boss: isBoss };
  warpTarget = 0;
  if (isBoss) sfx.warn();
}
function updateWave(dt) {
  if (wctl.boss && !boss && wctl.bossT > -5) { wctl.bossT -= dt; if (wctl.bossT <= 0) { spawnBoss(); wctl.bossT = -9; } }
  if (wctl.toSpawn > 0) {
    wctl.spawnT -= dt;
    if (wctl.spawnT <= 0) { spawnFormation(); wctl.toSpawn--; wctl.spawnT = wctl.interval * rand(0.75, 1.2); }
  } else if (!wctl.cleared && enemies.length === 0 && !boss && (!wctl.boss || wctl.bossT < -5)) {
    wctl.cleared = true; wctl.clearT = 3;
    const bonus = wave * 1000; addScore(bonus);
    popup(W / 2, H * 0.4, 'WAVE CLEAR', '#7fffd4', 44, 2.2);
    popup(W / 2, H * 0.4 + 46, '+' + bonus.toLocaleString(), '#ffffff', 24, 2.2);
    warpTarget = 1; sfx.power();
  }
  if (wctl.cleared) {
    wctl.clearT -= dt;
    if (wctl.clearT < 0.8) warpTarget = 0;
    if (wctl.clearT <= 0) startWave(wave + 1);
  }
}

const ET = {
  drone: { hp: 3, r: 16, score: 100, col: '#ff3b6b' },
  dart: { hp: 2, r: 14, score: 150, col: '#ffb020' },
  tank: { hp: 34, r: 30, score: 700, col: '#a66bff' },
  spinner: { hp: 22, r: 24, score: 500, col: '#22d3ee' },
  boss: { hp: 900, r: 80, score: 30000, col: '#ff3d7f' },
};
function mkEnemy(type, x, y, o = {}) {
  const d = ET[type];
  const e = Object.assign({ type, x, y, t: 0, hp: d.hp * (1 + (wave - 1) * 0.1), r: d.r, score: d.score, col: d.col, flash: 0, rot: 0, fireT: rand(0.8, 2.2), dead: false }, o);
  e.maxhp = e.hp;
  enemies.push(e);
  return e;
}
function spawnFormation() {
  const pool = ['snake', 'snake', 'row', 'dive'];
  if (wave >= 2) pool.push('tank', 'dive');
  if (wave >= 3) pool.push('spinner', 'row');
  if (wave >= 6) pool.push('tank', 'spinner', 'swarm');
  const f = pick(pool);
  if (f === 'snake') {
    const n = 5 + Math.min(5, wave >> 1), bx = rand(W * 0.2, W * 0.8), amp = rand(60, Math.min(200, W * 0.25)), fr = rand(1.5, 2.6);
    for (let i = 0; i < n; i++) mkEnemy('drone', bx, -30 - i * 42, { bx, amp, freq: fr, ph: -i * 0.45, spd: 130 + wave * 4 });
  } else if (f === 'row') {
    const n = Math.min(9, 4 + (wave >> 1)), gap = Math.min(70, (W - 80) / n);

function spawnBoss() {

// ---------- shooting ----------
function eShoot(x, y, ang, spd, col = '#ff4d8d', r = 6) {

}
function aim(e) { return Math.atan2(player.y - e.y, player.x - e.x); }
function pShoot(x, y, ang, spd = 1100, dmg = 1, w = 3) {

// ---------- damage ----------
function damage(e, d, x, y) {

}
function kill(e) {

  if (combo % 10 === 0) { popup(W / 2, H * 0.28, combo + ' COMBO!', '#ff6bd6', 34, 1.2); ring(W / 2, H * 0.28, 160, '#ff6bd6', 3, 0.6); }

  if (Math.random() < chance) dropItem(e.x, e.y);
}
function dropItem(x, y, kind) {
  if (!kind) { const r = Math.random(); kind = r < 0.6 ? 'P' : r < 0.8 ? 'S' : 'B'; }
  items.push({ x, y, kind, t: 0, vx: rand(-60, 60), vy: rand(-120, -40) });
}
function bossDeath(b) {

  explode(b.x, b.y, 4, '#ffffff');

function useBomb() {

function hurtPlayer() {

// ---------- update ----------
function update(dt) {
  T += dt; stateT += dt;
  if (paused) return;
  shakeAmt *= Math.exp(-dt * 9); if (shakeAmt < 0.05) shakeAmt = 0;
  flashA = Math.max(0, flashA - dt * 2.5);
  if (slowT > 0) { slowT -= dt; timeScale = lerp(timeScale, 0.25, 1 - Math.exp(-dt * 12)); }
  else timeScale = lerp(timeScale, 1, 1 - Math.exp(-dt * 4));
  let gdt = dt * timeScale;
  if (hitstop > 0) { hitstop -= dt; gdt *= 0.06; }

  updateBg(gdt);

  if (state === 'title') {
    warpTarget = 0.15;
    const tx = W / 2 + Math.sin(T * 0.8) * W * 0.15, ty = H * 0.7 + Math.sin(T * 1.6) * 14;
    demo.vx = (tx - demo.x) / Math.max(dt, 1e-3); demo.x = tx; demo.y = ty;
    demo.tilt = lerp(demo.tilt, clamp(demo.vx / 500, -1, 1), 0.1);
    engineTrail(demo, gdt);
    updateParts(gdt);
    return;
  }

  if (state === 'play' || state === 'over') {
    if (banner) { banner.t += gdt; if (banner.t > 3) banner = null; }
    if (state === 'play') updatePlayer(gdt, dt);
    if (state === 'play') updateWave(gdt);
    updateBullets(gdt);
    for (const e of enemies) updateEnemy(e, gdt);
    collisions();
    enemies = enemies.filter(e => {
      if (e.dead) return false;
      if (e.type !== 'boss' && e.t > 1.5 && (e.y > H + 80 || e.y < -200 || e.x < -150 || e.x > W + 150)) return false;
      return true;
    });
    updateItems(gdt);
    updateParts(gdt);
    if (comboT > 0) { comboT -= gdt; if (comboT <= 0) combo = 0; }
    comboPulse = Math.max(0, comboPulse - dt * 4);
    dispScore = score - dispScore < 1 ? score : lerp(dispScore, score, 1 - Math.exp(-dt * 10));
    if (boss) bossHpDisp = lerp(bossHpDisp, boss.hp / boss.maxhp, 1 - Math.exp(-dt * 3));
    if (bombT > 0) { bombT -= dt; if (bombT > 0.4) eBullets.length = 0; }
    if (state === 'play' && player.dead) {
      deadT -= dt;
      if (deadT <= 0) {
        state = 'over'; stateT = 0;
        if (score > best) { best = score; newRecord = true; try { localStorage.setItem('novaStrikerBest', best); } catch (e) { } }
      }
    }
  }
}

function engineTrail(p, dt) {
  if (Math.random() < 0.9) for (const ex of [-9, 9]) {
    const sq = 1 - Math.abs(p.tilt) * 0.28;
    addP({ t: 'dot', x: p.x + ex * sq + rand(-2, 2), y: p.y + 26, vx: rand(-20, 20), vy: rand(250, 400), life: rand(0.12, 0.26), max: 0.26, size: rand(3, 6), col: Math.random() < 0.7 ? '#3aa8ff' : '#b14cff', drag: 0.9 });
  }
}

function updatePlayer(dt, rdt) {
  const p = player;
  if (p.dead) return;
  const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  let dvx = 0, dvy = 0;
  if (kx || ky) {
    mouse.active = false;
    const l = Math.hypot(kx, ky); dvx = kx / l * 480; dvy = ky / l * 480;
  } else if (mouse.active) {
    const tx = mouse.x, ty = mouse.y - (mouse.touch ? 70 : 0);
    dvx = clamp((tx - p.x) * 12, -1100, 1100); dvy = clamp((ty - p.y) * 12, -1100, 1100);
  }
  const k = 1 - Math.exp(-dt * 18);
  p.vx = lerp(p.vx, dvx, k); p.vy = lerp(p.vy, dvy, k);
  p.x = clamp(p.x + p.vx * dt, 20, W - 20); p.y = clamp(p.y + p.vy * dt, 30, H - 30);
  p.tilt = lerp(p.tilt, clamp(p.vx / 600, -1, 1), 1 - Math.exp(-dt * 10));
  p.inv = Math.max(0, p.inv - dt);
  p.muzzle = Math.max(0, p.muzzle - dt * 12);
  if (p.shield > 0) p.shield = Math.max(0, p.shield - dt);
  p.fireT -= dt;
  if (p.fireT <= 0) { p.fireT = 0.085; playerFire(); }
  if (p.power >= 3) { p.misT -= dt; if (p.misT <= 0) { p.misT = p.power >= 5 ? 0.4 : 0.6; fireMissiles(); } }
  engineTrail(p, dt);
  // 고속 이동시 윙팁 비행운
  if (Math.abs(p.vx) > 350) for (const s of [-1, 1]) addP({ t: 'dot', x: p.x + s * 30 * (1 - Math.abs(p.tilt) * 0.28), y: p.y + 18, vx: 0, vy: 200, life: 0.25, max: 0.25, size: 2.5, col: '#cfe8ff', drag: 1 });
}

function nearestEnemy(x, y) {
  let best = null, bd = 1e9;
  for (const e of enemies) { if (e.dead || e.dying > 0 || e.y < -20) continue; const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd) { bd = d; best = e; } }
  return best;
}
function updateBullets(dt) {
  for (const b of pBullets) {
    b.life -= dt;
    if (b.kind === 'm') {
      const tgt = nearestEnemy(b.x, b.y);
      const want = tgt ? Math.atan2(tgt.y - b.y, tgt.x - b.x) : -Math.PI / 2;
      let da = want - b.ang; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      b.ang += clamp(da, -7 * dt, 7 * dt);
      const sp = Math.min(900, Math.hypot(b.vx, b.vy) + 1600 * dt);
      b.vx = lerp(b.vx, Math.cos(b.ang) * sp, 0.2); b.vy = lerp(b.vy, Math.sin(b.ang) * sp, 0.2);
      addP({ t: 'smoke', x: b.x, y: b.y, vx: rand(-10, 10), vy: rand(-10, 10), life: 0.45, max: 0.45, size: 4, col: '#000', drag: 0.9 });
      addP({ t: 'dot', x: b.x, y: b.y, vx: 0, vy: 0, life: 0.12, max: 0.12, size: 6, col: '#ff9a3c', drag: 1 });
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
  pBullets = pBullets.filter(b => b.life > 0 && b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40);
  for (const b of eBullets) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; }
  eBullets = eBullets.filter(b => b.y > -60 && b.y < H + 60 && b.x > -60 && b.x < W + 60);
}

function hitTest(e, x, y, pad = 0) {
  if (e.type === 'boss') { const dx = (x - e.x) / (e.rx + pad), dy = (y - e.y) / (e.ry + pad); return dx * dx + dy * dy < 1; }
  const r = e.r + pad; return (x - e.x) ** 2 + (y - e.y) ** 2 < r * r;
}
function collisions() {
  for (const b of pBullets) {
    if (b.life <= 0) continue;
    for (const e of enemies) {
      if (e.dead || e.dying > 0 || e.y < -30) continue;
      if (hitTest(e, b.x, b.y, b.kind === 'm' ? 6 : 2)) {
        damage(e, b.dmg, b.x, b.y); b.life = 0;
        if (b.kind === 'm') { addP({ t: 'flash', x: b.x, y: b.y, vx: 0, vy: 0, life: 0.12, max: 0.12, size: 30, col: '#ffb060', drag: 1 }); sparks(b.x, b.y, '#ffb060', 6, 350); }
        break;
      }
    }
  }
  if (state !== 'play' || player.dead) return;
  const p = player;
  for (const b of eBullets) {
    if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < (b.r * 0.7 + 4) ** 2) { b.y = 1e5; hurtPlayer(); break; }
  }
  for (const e of enemies) {
    if (e.dead || e.dying > 0) continue;
    if (hitTest(e, p.x, p.y, 8)) { hurtPlayer(); if (e.type !== 'boss') damage(e, 12, e.x, e.y); break; }
  }
}

function updateEnemy(e, dt) {
  e.t += dt; e.flash = Math.max(0, e.flash - dt * 8);
  const bs = 1 + wave * 0.035;
  switch (e.type) {
    case 'drone':
      e.y += e.spd * dt; e.x = e.bx + Math.sin(e.t * e.freq + e.ph) * e.amp;
      if (wave >= 2) { e.fireT -= dt; if (e.fireT <= 0 && e.y > 20 && e.y < H * 0.6) { e.fireT = rand(2.5, 5); eShoot(e.x, e.y + 12, aim(e), 190 * bs, '#ff4d8d', 5); } }
      break;
    case 'dart':
      if (e.mode === 0) { e.y += 280 * dt; e.rot = Math.PI / 2; if (e.y > e.ty) { e.mode = 1; ring(e.x, e.y, 40, '#ffb020', 2, 0.35); } }
      else if (e.mode === 1) { e.wait -= dt; e.ang = aim(e); e.rot = e.ang; e.y += 20 * dt; if (e.wait <= 0) { e.mode = 2; e.spd = 80; } }
      else {
        e.spd = Math.min(1000, e.spd + 1600 * dt);
        e.x += Math.cos(e.ang) * e.spd * dt; e.y += Math.sin(e.ang) * e.spd * dt; e.rot = e.ang;
        addP({ t: 'dot', x: e.x - Math.cos(e.ang) * 14, y: e.y - Math.sin(e.ang) * 14, vx: 0, vy: 0, life: 0.2, max: 0.2, size: 7, col: '#ff8a00', drag: 1 });
      }
      break;

      e.rot = aim(e); e.recoil = Math.max(0, e.recoil - dt * 5);

        const bx = e.x + Math.cos(e.rot) * 32, by = e.y + Math.sin(e.rot) * 32;
        for (let k = -1; k <= 1; k++) eShoot(bx, by, e.rot + k * 0.2, 230 * bs, '#c084fc', 7);
        addP({ t: 'flash', x: bx, y: by, vx: 0, vy: 0, life: 0.12, max: 0.12, size: 30, col: '#c084fc', drag: 1 });
      }
      break;
    case 'spinner':

      if (e.t > 1.6 && e.t < 6.5) { e.fireT -= dt; if (e.fireT <= 0) { e.fireT = Math.max(0.1, 0.18 - wave * 0.004); for (let k = 0; k < 3; k++) eShoot(e.x, e.y, e.rot + k * TAU / 3, 165 * bs, '#22d3ee', 6); } }
      break;
    case 'boss': updateBoss(e, dt, bs); break;
  }
}

function updateBoss(b, dt, bs) {
  b.coreRot += dt * (1.5 + b.phase * 1.2);
  if (b.dying > 0) {
    b.dying -= dt; b.flash = Math.random() < 0.3 ? 1 : 0;
    b.y += 14 * dt; b.x += rand(-3, 3);
    if (Math.random() < dt * 16) explode(b.x + rand(-130, 130), b.y + rand(-50, 50), rand(0.6, 1.4), pick(['#ff3d7f', '#ffb020', '#a66bff', '#ffffff']));

    popup(W / 2, H * 0.45, 'PHASE ' + (ph + 1), '#ff3d7f', 40, 1.5);
    b.fireT = 1; b.fireT2 = 1.5; sfx.warn();
  }

  b.fireT -= dt; b.fireT2 -= dt;
  const cy = b.y + 20;
  if (ph === 0) {
    if (b.fireT <= 0) { b.fireT = 0.12; b.spin += 0.29; eShoot(b.x, cy, b.spin, 160 * bs, '#ff4d8d', 6); eShoot(b.x, cy, b.spin + Math.PI, 160 * bs, '#ff4d8d', 6); }
    if (b.fireT2 <= 0) { b.fireT2 = 1.6; for (const s of [-1, 1]) { const wx = b.x + s * 85, wy = b.y + 25, a = Math.atan2(player.y - wy, player.x - wx); for (let k = -2; k <= 2; k++) eShoot(wx, wy, a + k * 0.14, 250 * bs, '#ffd166', 7); addP({ t: 'flash', x: wx, y: wy, vx: 0, vy: 0, life: 0.15, max: 0.15, size: 40, col: '#ffd166', drag: 1 }); } }

    if (b.fireT <= 0) { b.fireT = 0.09; b.spin += 0.17 + Math.sin(tt) * 0.1; for (let k = 0; k < 4; k++) eShoot(b.x, cy, b.spin + k * TAU / 4, 150 * bs, '#ff4d8d', 6); }

function updateItems(dt) {
  for (const it of items) {
    it.t += dt;
    it.vy = lerp(it.vy, 70, 1 - Math.exp(-dt * 2)); it.vx = lerp(it.vx, 0, 1 - Math.exp(-dt * 2));
    it.x += (it.vx + Math.sin(it.t * 3) * 30) * dt; it.y += it.vy * dt;
    if (state === 'play' && !player.dead) {
      const dx = player.x - it.x, dy = player.y - it.y, d = Math.hypot(dx, dy);
      if (d < 140) { it.x += dx / d * 500 * dt; it.y += dy / d * 500 * dt; }
      if (d < 30) { it.got = true; collect(it); }
    }

}
function collect(it) {
  const p = player, col = itemCol(it.kind);

}

function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt;
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d; p.x += p.vx * dt; p.y += p.vy * dt;

  for (let i = 0; i < p.bombs; i++) {
    const x = 26 + i * 26, y = H - 24;
    ctx.globalCompositeOperation = 'lighter'; drawGlow(x, y, 14, '#ff3d7f', 0.6); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#1a0a1a'; ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ff3d7f'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ff3d7f'; ctx.font = `900 9px ${F}`; ctx.textAlign = 'center'; ctx.fillText('B', x, y + 3.5); ctx.textAlign = 'left';
  }
  // power
  const px = W / 2 - 60, py = H - 26;
  ctx.fillStyle = 'rgba(255,190,120,0.7)'; ctx.font = `700 10px ${F}`; ctx.textAlign = 'center'; ctx.fillText(p.power >= 5 ? 'MAX POWER' : 'POWER', W / 2, py - 8);
  for (let i = 0; i < 5; i++) {
    const on = i < p.power;
    ctx.fillStyle = on ? (p.power >= 5 ? `hsl(${(T * 200 + i * 40) % 360},100%,65%)` : '#ff9f1c') : 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.moveTo(px + i * 24 + 4, py); ctx.lineTo(px + i * 24 + 24, py); ctx.lineTo(px + i * 24 + 20, py + 8); ctx.lineTo(px + i * 24, py + 8); ctx.closePath(); ctx.fill();
  }
  // 터치용 폭탄 버튼
  if (mouse.touch) {
    ctx.globalAlpha = p.bombs > 0 ? 0.8 : 0.3;
    ctx.strokeStyle = '#ff3d7f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W - 60, H - 70, 34, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#ff3d7f'; ctx.font = `900 13px ${F}`; ctx.textAlign = 'center'; ctx.fillText('BOMB', W - 60, H - 66);
    ctx.globalAlpha = 1;
  }
  // boss hp
  if (boss) {
    const bw = Math.min(520, W * 0.6), bx = W / 2 - bw / 2, by = 84;
    const appear = clamp(boss.t / 1.2, 0, 1), aw = bw * ease.outCubic(appear);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W / 2 - aw / 2, by, aw, 10);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(W / 2 - aw / 2, by, aw * bossHpDisp, 10);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, '#ff3d7f'); g.addColorStop(1, '#ffb020');
    ctx.fillStyle = g; ctx.fillRect(W / 2 - aw / 2, by, aw * Math.max(0, boss.hp / boss.maxhp), 10);
    ctx.strokeStyle = 'rgba(255,61,127,0.8)'; ctx.lineWidth = 1; ctx.strokeRect(W / 2 - aw / 2 - 2, by - 2, aw + 4, 14);
    for (const m of [0.33, 0.66]) { ctx.fillStyle = '#000'; ctx.fillRect(W / 2 - aw / 2 + aw * m - 1, by, 2, 10); }
    ctx.globalAlpha = appear; ctx.fillStyle = '#ff9ec4'; ctx.font = `700 11px ${F}`; ctx.textAlign = 'center';
    ctx.fillText('DREADNOUGHT  Ω-' + (wave / 5), W / 2, by - 8); ctx.globalAlpha = 1;
  }
}

function drawBanner() {
  if (!banner) return;
  const t = banner.t, inD = 0.45, outS = 2.3;
  let x = 0, a = 1;
  if (t < inD) { const k = ease.outCubic(t / inD); x = (1 - k) * -W; }
  else if (t > outS) { const k = ease.inCubic(Math.min(1, (t - outS) / 0.5)); x = k * W; a = 1 - k; }
  const y = H * 0.36, bh = 96;
  ctx.save(); ctx.globalAlpha = a;
  if (banner.boss) {
    // 붉은 경고 화면 테두리
    const pul = 0.5 + 0.5 * Math.sin(T * 10);
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${0.35 * pul})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.translate(x, 0);
  ctx.fillStyle = banner.boss ? 'rgba(60,0,10,0.75)' : 'rgba(5,10,40,0.7)';
  ctx.fillRect(0, y - bh / 2, W, bh);
  // 줄무늬
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - bh / 2, W, 8); ctx.rect(0, y + bh / 2 - 8, W, 8); ctx.clip();
  ctx.fillStyle = banner.boss ? '#ffcc00' : '#4cc9ff';
  const off = (T * 120) % 40;
  for (let i = -40; i < W + 40; i += 40) { ctx.beginPath(); ctx.moveTo(i + off, y - bh / 2 - 10); ctx.lineTo(i + off + 20, y - bh / 2 - 10); ctx.lineTo(i + off, y + bh / 2 + 10); ctx.lineTo(i + off - 20, y + bh / 2 + 10); ctx.fill(); }
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const blink = banner.boss ? (Math.sin(T * 14) > -0.3 ? 1 : 0.35) : 1;
  ctx.globalAlpha = a * blink;
  const sz = Math.min(56, W / 9);
  ctx.font = `900 ${sz}px ${F}`;
  const sp = banner.boss ? 14 : 8, txt = banner.text.split('').join(String.fromCharCode(8202));
  ctx.shadowColor = banner.boss ? '#ff2040' : '#4cc9ff'; ctx.shadowBlur = 24;
  ctx.fillStyle = banner.boss ? '#ff4060' : '#ffffff';
  ctx.letterSpacing = sp + 'px';
  ctx.fillText(banner.text, W / 2, y - 10);
  ctx.letterSpacing = '0px';
  ctx.shadowBlur = 0; ctx.globalAlpha = a;
  ctx.font = `700 15px ${FK}`; ctx.fillStyle = banner.boss ? '#ffc2c8' : '#a6dcff';
  ctx.fillText(banner.sub, W / 2, y + 28);
  ctx.restore();
}

function drawTitle() {
  // demo ship
  drawParts(false);
  drawPlayer(demo);
  const t = stateT, title = 'NOVA STRIKER';
  const sz = Math.min(84, W / 8.5);
  ctx.font = `900 ${sz}px ${F}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const ws = [...title].map(c => ctx.measureText(c).width + sz * 0.06);
  const total = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2; const y = H * 0.3;
  // 회전하는 링 장식
  ctx.save(); ctx.translate(W / 2, y); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    ctx.rotate(T * (0.3 + i * 0.2) * (i % 2 ? -1 : 1));
    ctx.strokeStyle = i === 1 ? 'rgba(255,79,216,0.35)' : 'rgba(76,201,255,0.3)'; ctx.lineWidth = 2;
    const R = total * 0.42 + i * 26;
    ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.28, 0, 0, Math.PI * 1.2); ctx.stroke();
  }
  ctx.restore(); ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createLinearGradient(0, y - sz / 2, 0, y + sz / 2);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#7ff3ff'); g.addColorStop(1, '#ff4fd8');
  [...title].forEach((c, i) => {
    const k = clamp((t - i * 0.06) / 0.6, 0, 1);
    const s = ease.outElastic(k), yy = y + Math.sin(T * 3 + i * 0.5) * 6 + (1 - k) * -80;
    ctx.save(); ctx.translate(x + ws[i] / 2, yy); ctx.scale(s, s); ctx.globalAlpha = k;
    ctx.shadowColor = '#4cc9ff'; ctx.shadowBlur = 26;
    ctx.fillStyle = g; ctx.textAlign = 'center'; ctx.fillText(c, 0, 0);
    ctx.restore();
    x += ws[i];
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.textAlign = 'center';
  const ka = clamp((t - 0.9) / 0.5, 0, 1);
  ctx.globalAlpha = ka;
  ctx.font = `700 ${Math.min(18, W / 26)}px ${FK}`; ctx.fillStyle = '#c8dcff'; ctx.letterSpacing = '6px';
  ctx.fillText('은 하 방 위 대   출 격', W / 2, y + sz * 0.85); ctx.letterSpacing = '0px';
  if (t > 1.3) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 5);
    ctx.font = `900 ${Math.min(22, W / 20)}px ${FK}`; ctx.fillStyle = '#ffffff';
    ctx.fillText('클릭 또는 SPACE 로 출격', W / 2, H * 0.88);
  }
  ctx.globalAlpha = ka * 0.75;
  ctx.font = `500 13px ${FK}`; ctx.fillStyle = '#9fb8e8';
  ctx.fillText('이동: 마우스 · WASD · 방향키    폭탄: 우클릭 · X    일시정지: P    소리: M', W / 2, H * 0.94);
  if (best > 0) { ctx.font = `700 13px ${F}`; ctx.fillStyle = '#ffd166'; ctx.fillText('BEST  ' + best.toLocaleString(), W / 2, y + sz * 0.85 + 32); }
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  const t = stateT;
  ctx.fillStyle = `rgba(0,0,10,${Math.min(0.65, t * 0.8)})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const k = clamp(t / 0.6, 0, 1), s = 3 - 2 * ease.outBack(k);
  ctx.save(); ctx.translate(W / 2, H * 0.36); ctx.scale(s, s); ctx.globalAlpha = k;
  ctx.font = `900 ${Math.min(72, W / 9)}px ${F}`; ctx.shadowColor = '#ff2040'; ctx.shadowBlur = 30; ctx.fillStyle = '#ff4060';
  ctx.fillText('GAME OVER', 0, 0); ctx.restore(); ctx.shadowBlur = 0;
  if (t > 0.6) {
    const k2 = clamp((t - 0.6) / 0.8, 0, 1);
    ctx.globalAlpha = k2;
    ctx.font = `700 14px ${F}`; ctx.fillStyle = '#9fb8e8'; ctx.fillText('FINAL SCORE', W / 2, H * 0.48);
    ctx.font = `900 44px ${F}`; ctx.fillStyle = '#fff'; ctx.shadowColor = '#4cc9ff'; ctx.shadowBlur = 16;
    ctx.fillText(Math.floor(score * ease.outCubic(k2)).toLocaleString(), W / 2, H * 0.48 + 40); ctx.shadowBlur = 0;
    ctx.font = `700 14px ${F}`; ctx.fillStyle = '#9fb8e8'; ctx.fillText('WAVE ' + wave, W / 2, H * 0.48 + 80);
    if (newRecord && k2 >= 1) {
      ctx.save(); ctx.translate(W / 2, H * 0.48 + 112); ctx.scale(1 + Math.sin(T * 8) * 0.06, 1 + Math.sin(T * 8) * 0.06);
      ctx.font = `900 22px ${F}`; ctx.fillStyle = `hsl(${(T * 200) % 360},100%,65%)`; ctx.fillText('NEW RECORD!', 0, 0); ctx.restore();
    }
  }
  if (t > 1.2) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 5);
    ctx.font = `900 20px ${FK}`; ctx.fillStyle = '#fff'; ctx.fillText('클릭 또는 SPACE 로 재출격', W / 2, H * 0.8);
  }
  ctx.globalAlpha = 1;
}

// ---------- render ----------
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBg();
  if (state === 'title') {
    drawTitle();
  } else {
    const sx = shakeAmt ? rand(-1, 1) * shakeAmt : 0, sy = shakeAmt ? rand(-1, 1) * shakeAmt : 0;
    ctx.translate(sx, sy);
    if (shakeAmt > 12) { ctx.translate(W / 2, H / 2); ctx.rotate(rand(-1, 1) * shakeAmt * 0.0015); ctx.translate(-W / 2, -H / 2); }
    drawParts(true);
    drawDebris();
    for (const it of items) drawItem(it);
    for (const e of enemies) drawEnemy(e);
    if (!player.dead) drawPlayer(player);
    drawBullets();
    drawParts(false);
    drawPopups();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBanner();
  }
  // 화면 플래시 & 비네팅
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (flashA > 0) { ctx.globalAlpha = Math.min(1, flashA); ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.drawImage(vignette, 0, 0, W, H);
  if (state !== 'title') drawHUD();
  if (state === 'over') drawGameOver();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,10,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
    ctx.font = `900 48px ${F}`; ctx.fillText('PAUSED', W / 2, H / 2 - 10);
    ctx.font = `500 15px ${FK}`; ctx.fillStyle = '#9fb8e8'; ctx.fillText('P 키를 눌러 계속', W / 2, H / 2 + 34);
  }
  if (muted) { ctx.textAlign = 'right'; ctx.font = `700 10px ${F}`; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillText('MUTED', W - 18, H - 14); }
}

// ---------- loop ----------
resize();
addEventListener('resize', resize);
planet.y = H * 0.25;
demo.x = W / 2; demo.y = H * 0.7;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
