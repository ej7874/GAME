<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON DASH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0a0418;overflow:hidden;touch-action:none;user-select:none}
  canvas{display:block}
  #menu{position:fixed;top:10px;left:50%;transform:translateX(-50%);font:700 11px 'Orbitron',sans-serif;letter-spacing:2px;color:#ffe08a;text-decoration:none;padding:5px 12px;border:1px solid rgba(255,200,80,.35);border-radius:20px;background:rgba(30,10,30,.5);opacity:.6;transition:.2s}
  #menu:hover{opacity:1;box-shadow:0 0 14px #ffb020}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="menu" href="index.html">◀ MENU</a>
<script>
'use strict';
// ================================================================
//  NEON DASH — 신스웨이브 러너
// ================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, GY = 400, PX = 200;
const F = "'Orbitron','Segoe UI',sans-serif", FK = "'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, pick = a => a[(Math.random() * a.length) | 0];
const ease = {
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const glowCache = {};
function glow(col) {
  if (glowCache[col]) return glowCache[col];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.2, col); gr.addColorStop(0.5, col + '55'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return glowCache[col] = c;
}
function drawGlow(x, y, r, col, a = 1) { if (r <= 0 || a <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glow(col), x - r, y - r, r * 2, r * 2); }

// ---------- audio + beat ----------
let AC = null, master = null, muted = false, noiseBuf = null, nextBeat = 0, beatN = 0, beatPulse = 0, beatQueue = [];
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.3; master.connect(AC.destination); nextBeat = AC.currentTime + 0.1; setInterval(scheduler, 25); } catch (e) { }
}
function tone(f1, f2, dur, type = 'square', vol = 0.15, at = 0) {
  if (!AC || muted) return; const t = at || AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1500, at = 0, hp = false) {
  if (!AC || muted) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = at || AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = hp ? 'highpass' : 'lowpass'; f.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const BASS = [55, 55, 65.4, 55, 73.4, 55, 65.4, 49];
function scheduler() {
  if (!AC) return;
  const playing = state === 'play' && !paused;
  const spb = 60 / (state === 'play' ? 118 + Math.min(40, speed / 25) : 100) / 2; // 8분음표 단위
  while (nextBeat < AC.currentTime + 0.12) {
    if (playing && !muted) {
      const n = beatN % 16;
      if (n % 4 === 0) { tone(150, 40, 0.18, 'sine', 0.45, nextBeat); beatQueue.push(nextBeat); }
      if (n % 4 === 2) noise(0.05, 0.08, 7000, nextBeat, true);
      if (n % 8 === 4) noise(0.15, 0.18, 2500, nextBeat);
      tone(BASS[(beatN >> 1) % 8], BASS[(beatN >> 1) % 8] * 0.99, spb * 0.9, 'sawtooth', 0.06, nextBeat);
      if (n % 2 === 0 && hash(beatN * 3.1) > 0.55) { const f = [440, 523, 659, 784][(hash(beatN) * 4) | 0]; tone(f, f, 0.12, 'square', 0.025, nextBeat); }
    }
    nextBeat += spb; beatN++;
  }
}
const sfx = {
  jump() { tone(300, 700, 0.12, 'square', 0.08); },
  djump() { tone(500, 1200, 0.15, 'triangle', 0.1); },
  land() { noise(0.06, 0.1, 600); },
  orb(n) { const f = 880 * Math.pow(1.06, Math.min(12, n)); tone(f, f * 1.5, 0.1, 'triangle', 0.1); },
  die() { noise(0.8, 0.6, 2500); tone(300, 30, 0.8, 'sawtooth', 0.25); },
  slide() { noise(0.2, 0.06, 3000, 0, true); },
  mile() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'square', 0.07, AC ? AC.currentTime + i * 0.07 : 0)); },
};

// ---------- input ----------
const keys = {}; let jumpBuf = 0, jumpHeld = false, slideHeld = false, paused = false;
function pressJump() { initAudio(); if (state !== 'play') { if (state === 'title' || (state === 'over' && stateT > 1.2)) newGame(); return; } if (paused) { paused = false; return; } jumpBuf = 0.14; jumpHeld = true; }
function releaseJump() { jumpHeld = false; if (player && player.vy < -300 && !player.dead) player.vy *= 0.55; }
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return; keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') pressJump();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { slideHeld = true; initAudio(); }
  if (e.code === 'KeyM') muted = !muted;
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') releaseJump();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') slideHeld = false;
});
const touchSlide = new Set();
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (e.button === 2 || (e.pointerType === 'touch' && e.clientX < W * 0.4 && state === 'play')) { slideHeld = true; touchSlide.add(e.pointerId); return; }
  pressJump();
});
addEventListener('pointerup', e => { if (touchSlide.has(e.pointerId) || e.button === 2) { touchSlide.delete(e.pointerId); slideHeld = touchSlide.size > 0 || keys.ArrowDown || keys.KeyS; } else releaseJump(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { if (state === 'play') paused = true; });

// ---------- state ----------
let state = 'title', stateT = 0, T = 0;
let player = null, cam = 0, speed = 430, solids = [], hazards = [], orbs = [], genX = 0;
let parts = [], rings = [], popups = [], trail = [], pieces = [];
let shakeAmt = 0, flashA = 0, flashCol = '#fff', slowmo = 0, orbCount = 0, orbChain = 0, orbChainT = 0, nextMile = 500, deadT = 0, newRecord = false, banner = null;
let best = 0; try { best = +localStorage.getItem('neonDashBest') || 0; } catch (e) { }
const meters = () => Math.floor(cam / 40);
const scoreNow = () => meters() + orbCount * 25;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  GY = Math.round(H * 0.72); PX = Math.min(W * 0.25, 260);
}
addEventListener('resize', () => { const old = GY; resize(); const d = GY - old; for (const s of solids) s.y += d; for (const h of hazards) h.y += d; for (const o of orbs) o.y += d; if (player) player.y += d; });

function newGame() {
  cam = 0; speed = 430; solids = []; hazards = []; orbs = []; genX = 0; parts = []; rings = []; popups = []; trail = []; pieces = [];
  orbCount = 0; orbChain = 0; nextMile = 500; newRecord = false; slowmo = 0;
  player = { y: GY, vy: 0, onGround: true, jumps: 0, coyote: 0, rot: 0, sq: 0, slide: false, dead: false, hue: 185 };
  state = 'play'; stateT = 0;
  banner = { t: 0, text: 'GO!', sub: '장애물을 피해 최대한 멀리!' };
  ring(PX, GY - 20, 160, '#7ff3ff', 5, 0.6);
  while (genX < W * 3) gen();
}

// ---------- level generation ----------
function addGround(x, w) { solids.push({ x, w, y: GY, h: H, k: 'g' }); }
function addSpikes(x, n, y = GY) { hazards.push({ k: 'spike', x, w: n * 30, y: y - 30, h: 30, n }); }
function addDrone(x) { hazards.push({ k: 'drone', x, w: 40, y: GY - 58, h: 30, ph: rand(0, TAU) }); }
function addBlock(x, h) { solids.push({ x, w: 46, y: GY - h, h, k: 'b' }); }
function orbArc(x0, x1, yTop, n) { for (let i = 0; i < n; i++) { const k = i / (n - 1 || 1); orbs.push({ x: lerp(x0, x1, k), y: yTop + Math.pow(k * 2 - 1, 2) * 70, got: false, ph: i * 0.4 }); } }
function orbLine(x, y, n) { for (let i = 0; i < n; i++) orbs.push({ x: x + i * 40, y, got: false, ph: i * 0.4 }); }

function gen() {
  const d = clamp(cam / 30000, 0, 1), sp = speed;
  if (genX < 900) { addGround(genX, 1100); orbLine(500, GY - 40, 6); genX += 1100; return; }
  const r = Math.random();
  if (r < 0.42) {
    // 평지 + 장애물
    const L = rand(700, 1100); addGround(genX, L);
    const gapMin = Math.max(320, sp * 0.62);
    let x = genX + 220;
    while (x < genX + L - 180) {
      const o = Math.random();
      if (o < 0.4) { const n = 1 + ((Math.random() * (1 + d * 2.2)) | 0); addSpikes(x, n); if (Math.random() < 0.5) orbArc(x - 40, x + n * 30 + 40, GY - 150, 5); x += n * 30; }
      else if (o < 0.65 && cam > 1500) { addDrone(x); orbLine(x - 20, GY - 20, 3); x += 40; }
      else { const h = Math.random() < 0.5 ? 46 : 80; addBlock(x, h); if (Math.random() < 0.6) orbLine(x + 3, GY - h - 30, 1); if (h === 46 && Math.random() < 0.4 + d * 0.4) { addSpikes(x + 46 + 10, 1 + (d > 0.4 ? 1 : 0)); x += 60; } x += 46; }
      x += gapMin * rand(1, 1.6);
    }
    genX += L;
  } else if (r < 0.66) {
    // 구멍
    const gap = rand(110, Math.min(110 + sp * 0.3, sp * 0.52));
    orbArc(genX - 20, genX + gap + 20, GY - 170, 5);
    genX += gap; addGround(genX, rand(420, 700)); genX = solids[solids.length - 1].x + solids[solids.length - 1].w;
  } else if (r < 0.84) {
    // 공중 발판
    const gap = rand(sp * 0.75, sp * 0.95) + 80;
    const pw = 180, py = GY - rand(90, 120);
    solids.push({ x: genX + gap / 2 - pw / 2, w: pw, y: py, h: 18, k: 'p' });
    orbLine(genX + gap / 2 - 60, py - 34, 4);
    if (d > 0.3 && Math.random() < 0.5) addSpikes(genX + gap / 2 - 15, 1, py);
    genX += gap; addGround(genX, rand(500, 800)); genX += solids[solids.length - 1].w;
  } else {
    // 계단 블록
    const L = 900; addGround(genX, L);
    addBlock(genX + 260, 46); addBlock(genX + 260 + Math.max(150, sp * 0.3), 92);
    orbLine(genX + 270, GY - 92 - 60, 3);
    if (d > 0.2) addSpikes(genX + 260 + Math.max(150, sp * 0.3) + 46, 3);
    genX += L;
  }
}

// ---------- effects ----------
function shake(a) { shakeAmt = Math.min(30, Math.max(shakeAmt, a)); }
function flash(a, c = '#fff') { flashA = Math.max(flashA, a); flashCol = c; }
function ring(x, y, maxR, col, w = 3, life = 0.45) { rings.push({ x, y, r: 0, maxR, col, w, life, max: life, world: false }); }
function popup(x, y, text, col = '#fff', size = 16, life = 0.9) { popups.push({ x, y, text, col, size, life, max: life }); }
function addP(p) { if (parts.length < 1800) parts.push(p); }
function burst(x, y, col, n, spd = 300, g = 600) { for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(spd * 0.3, spd); addP({ t: 's', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), max: 0.6, size: rand(1.2, 2.5), col, g }); } }

// ---------- update ----------
function update(dt) {
  T += dt; stateT += dt;
  if (paused) return;
  shakeAmt *= Math.exp(-dt * 9); flashA = Math.max(0, flashA - dt * 2.5);
  if (AC && state === 'play' && !muted) { while (beatQueue.length && beatQueue[0] <= AC.currentTime) { beatQueue.shift(); beatPulse = 1; } }
  else beatPulse = Math.max(beatPulse, Math.pow(Math.max(0, Math.sin(T * Math.PI * 1.7)), 20));
  beatPulse = Math.max(0, beatPulse - dt * 3.5);
  let g = dt; if (slowmo > 0) { slowmo -= dt; g *= 0.25; }
  if (state === 'title') { cam += 300 * dt; updateFx(g); return; }
  if (banner) { banner.t += dt; if (banner.t > 1.8) banner = null; }
  if (state === 'play' && !player.dead) {
    speed = Math.min(1080, 430 + cam * 0.016);
    cam += speed * g;
    updatePlayer(g);
    while (genX < cam + W * 2.5) gen();
    solids = solids.filter(s => s.x + s.w > cam - 300);
    hazards = hazards.filter(h => h.x + h.w > cam - 300);
    orbs = orbs.filter(o => o.x > cam - 300 && !o.done);
    const m = meters();
    if (m >= nextMile) {
      banner = { t: 0, text: nextMile + 'M', sub: 'SPEED UP!' }; nextMile += 500; sfx.mile(); flash(0.2, '#ffb020');
      for (let i = 0; i < 3; i++) ring(PX, player.y - 20, 200 + i * 120, i % 2 ? '#ff4fd8' : '#ffb020', 4, 0.6 + i * 0.1);
    }
  } else if (player && player.dead) {
    deadT -= dt; cam += speed * 0.05 * g;
    if (deadT <= 0 && state === 'play') { state = 'over'; stateT = 0; const s = scoreNow(); if (s > best) { best = s; newRecord = true; try { localStorage.setItem('neonDashBest', best); } catch (e) { } } }
  }
  if (orbChainT > 0) { orbChainT -= g; if (orbChainT <= 0) orbChain = 0; }
  updateFx(g);
}

function overlapX(s, x0, x1) { return x1 > s.x && x0 < s.x + s.w; }
function updatePlayer(dt) {
  const p = player, wx = cam + PX, hw = 15;
  jumpBuf = Math.max(0, jumpBuf - dt);
  const wantSlide = slideHeld && p.onGround;
  if (wantSlide && !p.slide) { sfx.slide(); p.sq = -0.4; }
  p.slide = wantSlide;
  const ph = p.slide ? 22 : 38;
  // jump
  if (jumpBuf > 0) {
    if (p.onGround || p.coyote > 0) { p.vy = -900; p.onGround = false; p.coyote = 0; p.jumps = 1; jumpBuf = 0; p.sq = 0.5; sfx.jump(); for (let i = 0; i < 10; i++) addP({ t: 'd', x: PX + rand(-14, 14), y: p.y, vx: rand(-120, 60), vy: rand(-80, -10), life: 0.4, max: 0.4, size: rand(4, 8), col: '#ffd0ff', g: 0 }); }
    else if (p.jumps < 2) { p.vy = -800; p.jumps = 2; jumpBuf = 0; p.sq = 0.5; sfx.djump(); ring(PX, p.y - 18, 60, '#ff4fd8', 3, 0.35); burst(PX, p.y, '#ff4fd8', 12, 260, 0); }
  }
  // gravity
  const grav = slideHeld && !p.onGround ? 6200 : 2600;
  p.vy = Math.min(1800, p.vy + grav * dt);
  const prevY = p.y; let ny = p.y + p.vy * dt;
  let landed = false;
  for (const s of solids) {
    if (!overlapX(s, wx - hw, wx + hw)) continue;
    if (p.vy >= 0 && prevY <= s.y + 2 && ny >= s.y) { ny = s.y; landed = true; }
    else if (s.k === 'p' && p.vy < 0 && prevY - ph >= s.y + s.h - 2 && ny - ph < s.y + s.h) { ny = s.y + s.h + ph; p.vy = 60; } // 머리 쿵
  }
  p.y = ny;
  if (landed) {
    if (!p.onGround && prevY < p.y + 0.5 && p.vy > 300) { p.sq = -0.45; sfx.land(); for (let i = 0; i < 8; i++) addP({ t: 'd', x: PX + rand(-16, 16), y: p.y, vx: rand(-160, 160), vy: rand(-60, -10), life: 0.35, max: 0.35, size: rand(3, 6), col: '#b9a0ff', g: 0 }); }
    p.vy = 0; p.onGround = true; p.jumps = 0; p.coyote = 0.1;
  } else { if (p.onGround) p.coyote = 0.1; p.onGround = false; p.coyote = Math.max(0, p.coyote - dt); }
  // rotation
  if (p.onGround) { const tgt = Math.round(p.rot / (Math.PI / 2)) * (Math.PI / 2); p.rot = lerp(p.rot, tgt, 1 - Math.exp(-dt * 25)); }
  else p.rot += dt * (p.jumps === 2 ? 11 : 6.5);
  p.sq = lerp(p.sq, 0, 1 - Math.exp(-dt * 10));
  // trail
  trail.push({ x: wx, y: p.y - ph / 2, rot: p.rot, slide: p.slide }); if (trail.length > 10) trail.shift();
  if (p.slide && Math.random() < 0.8) addP({ t: 's', x: PX - 14, y: p.y, vx: rand(-500, -200), vy: rand(-200, -40), life: 0.3, max: 0.3, size: 2, col: pick(['#ffb020', '#fff']), g: 900 });
  if (speed > 700 && Math.random() < 0.3) addP({ t: 'line', x: W + 10, y: rand(40, GY - 10), vx: -speed * 2.2, vy: 0, life: 0.6, max: 0.6, size: rand(40, 120), col: '#ffffff', g: 0 });
  // 측면 충돌 (블록 / 지면 모서리)
  const x0 = wx - hw + 3, x1 = wx + hw - 3, top = p.y - ph + 3, bot = p.y - 3;
  for (const s of solids) {
    if (s.k === 'p') continue; // 공중 발판은 옆으로 통과 가능
    if (x1 > s.x && x0 < s.x + s.w && bot > s.y && top < s.y + s.h) { die(); return; }
  }
  for (const h of hazards) {
    let hy = h.y; if (h.k === 'drone') hy += Math.sin(T * 4 + h.ph) * 6;
    const pad = h.k === 'spike' ? 6 : 4;
    if (x1 > h.x + pad && x0 < h.x + h.w - pad && bot > hy + pad && top < hy + h.h) { die(); return; }
  }
  for (const o of orbs) {
    if (o.got) continue;
    const oy = o.y + Math.sin(T * 4 + o.ph) * 5;
    if (Math.abs(o.x - wx) < 26 && Math.abs(oy - (p.y - ph / 2)) < 30) {
      o.got = true; o.gotT = 0; orbCount++; orbChain++; orbChainT = 1.2;
      sfx.orb(orbChain); burst(o.x - cam, oy, '#ffd166', 8, 220, 0); ring(o.x - cam, oy, 30, '#ffd166', 2, 0.3);
      if (orbChain % 10 === 0) { popup(PX + 40, p.y - 80, orbChain + ' CHAIN!', '#ffd166', 22, 1); orbCount += 5; }
    }
  }
  if (p.y > H + 80) die(true);
}

function die(fell = false) {
  const p = player; if (p.dead) return;
  p.dead = true; deadT = 1.6; slowmo = 0.7;
  sfx.die(); shake(26); flash(0.6, '#ff2060');
  const cy = fell ? H - 30 : p.y - 19;
  for (let i = 0; i < 16; i++) pieces.push({ x: PX + ((i % 4) - 1.5) * 9, y: cy + (((i / 4) | 0) - 1.5) * 9, vx: rand(-500, 300), vy: rand(-700, -100), rot: rand(0, TAU), vr: rand(-15, 15), life: 2, s: 9 });
  burst(PX, cy, '#7ff3ff', 40, 600, 800); burst(PX, cy, '#ff4fd8', 30, 500, 800);
  ring(PX, cy, 220, '#ff4fd8', 6, 0.6); ring(PX, cy, 120, '#ffffff', 3, 0.4);
}

function updateFx(dt) {
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t !== 'line') { p.vx *= 0.97; p.vy *= 0.97; } }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.life -= dt; r.r = r.maxR * ease.outCubic(1 - r.life / r.max); }
  rings = rings.filter(r => r.life > 0);
  for (const p of popups) { p.life -= dt; p.y -= 30 * dt; }
  popups = popups.filter(p => p.life > 0);
  for (const pc of pieces) { pc.life -= dt; pc.vy += 1500 * dt; pc.x += pc.vx * dt; pc.y += pc.vy * dt; pc.rot += pc.vr * dt; if (pc.y > GY && pc.vy > 0 && pc.y < GY + 30) { pc.vy *= -0.4; pc.vx *= 0.7; pc.y = GY; } }
  pieces = pieces.filter(p => p.life > 0);
  for (const o of orbs) if (o.got) { o.gotT += dt; if (o.gotT > 0.3) o.done = true; }
}

// ---------- draw ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, '#0a0420'); g.addColorStop(0.55, '#2a0b4a'); g.addColorStop(1, '#ff2f7a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY + 2);
  // stars
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 90; i++) { const x = ((hash(i) * W * 1.5 - cam * 0.02) % W + W) % W, y = hash(i + 50) * GY * 0.6; ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(T * 2 + i)); ctx.fillRect(x, y, 1.6, 1.6); }
  ctx.globalAlpha = 1;
  // sun
  const sr = Math.min(W, H) * 0.24 * (1 + beatPulse * 0.03), sx = W * 0.62, sy = GY - sr * 0.35;
  ctx.globalCompositeOperation = 'lighter'; drawGlow(sx, sy, sr * 2.2, '#ff3d7f', 0.5 + beatPulse * 0.2); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.clip();
  const sg = ctx.createLinearGradient(0, sy - sr, 0, sy + sr); sg.addColorStop(0, '#ffe66d'); sg.addColorStop(0.5, '#ff8a3d'); sg.addColorStop(1, '#ff2f7a');
  ctx.fillStyle = sg; ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  ctx.fillStyle = '#3a0d55';
  for (let i = 0; i < 8; i++) { const k = i / 8, y = sy + sr * (0.05 + k * 0.95) + ((T * 20) % (sr / 8)), h = 2 + k * 9; ctx.fillRect(sx - sr, y, sr * 2, h); }
  ctx.restore();
  // mountains
  ctx.fillStyle = '#1c0838'; ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GY);
  for (let x = 0; x <= W + 20; x += 20) { const wx = x + cam * 0.08; const y = GY - 60 - (Math.sin(wx * 0.006) * 40 + Math.sin(wx * 0.017) * 25 + Math.abs(Math.sin(wx * 0.002)) * 70); ctx.lineTo(x, y); }
  ctx.lineTo(W, GY); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1;
  // city
  const bwid = 60, off = cam * 0.25, i0 = Math.floor(off / bwid);
  for (let i = i0; i < i0 + W / bwid + 2; i++) {
    const h = 40 + hash(i) * 140, w = bwid * (0.6 + hash(i + 9) * 0.35), x = i * bwid - off;
    ctx.fillStyle = '#120526'; ctx.fillRect(x, GY - h, w, h);
    ctx.fillStyle = hash(i + 3) > 0.5 ? '#7ff3ff' : '#ff4fd8';
    for (let wy = GY - h + 8; wy < GY - 6; wy += 12) for (let wxx = x + 5; wxx < x + w - 6; wxx += 10) {
      const on = hash(i * 31 + wy * 0.7 + wxx * 0.13) > 0.72; if (!on) continue;
      ctx.globalAlpha = 0.35 + beatPulse * 0.4 * hash(wxx); ctx.fillRect(wxx, wy, 4, 5);
    }
    ctx.globalAlpha = 1;
    if (hash(i + 7) > 0.8) { const bl = Math.sin(T * 4 + i) > 0; if (bl) { ctx.globalCompositeOperation = 'lighter'; drawGlow(x + w / 2, GY - h - 4, 6, '#ff2040', 0.9); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; } }
  }
  // horizon haze
  const hg = ctx.createLinearGradient(0, GY - 60, 0, GY); hg.addColorStop(0, 'rgba(255,47,122,0)'); hg.addColorStop(1, 'rgba(255,47,122,0.35)');
  ctx.fillStyle = hg; ctx.fillRect(0, GY - 60, W, 60);
}

function drawFloor() {
  // 공허 (구멍 아래)
  const vg = ctx.createLinearGradient(0, GY, 0, H); vg.addColorStop(0, '#1a0530'); vg.addColorStop(1, '#000');
  ctx.fillStyle = vg; ctx.fillRect(0, GY, W, H - GY);
  for (const s of solids) {
    const x = s.x - cam; if (x > W || x + s.w < 0) continue;
    if (s.k === 'g') {
      ctx.save(); ctx.beginPath(); ctx.rect(x, s.y, s.w, H - s.y); ctx.clip();
      const fg = ctx.createLinearGradient(0, s.y, 0, H); fg.addColorStop(0, '#2a0a4a'); fg.addColorStop(1, '#0a0218');
      ctx.fillStyle = fg; ctx.fillRect(x, s.y, s.w, H - s.y);
      // 원근 그리드
      ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,79,216,${0.35 + beatPulse * 0.4})`; ctx.lineWidth = 1.5;
      const vp = W * 0.62, depth = H - s.y;
      for (let i = -30; i <= 30; i++) { const bx = i * 80 - (cam % 80); ctx.beginPath(); ctx.moveTo(vp + (bx - vp) * 0.25, s.y); ctx.lineTo(bx + (bx - vp) * 1.6, H); ctx.stroke(); }
      for (let j = 0; j < 8; j++) { const k = ((j + (cam * 0.004) % 1) / 8); const y = s.y + depth * k * k; ctx.globalAlpha = 0.3 + k * 0.7; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s.w, y); ctx.stroke(); }
      ctx.restore();
      ctx.globalAlpha = 1;
      // 엣지 라인
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.shadowColor = '#7ff3ff'; ctx.shadowBlur = 14; ctx.strokeStyle = '#7ff3ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x, s.y); ctx.lineTo(x + s.w, s.y); ctx.lineTo(x + s.w, H); ctx.stroke(); ctx.restore();
    } else {
      const col = s.k === 'p' ? '#ffd166' : '#7ff3ff';
      ctx.fillStyle = s.k === 'p' ? 'rgba(60,30,10,0.9)' : 'rgba(20,10,50,0.92)'; ctx.fillRect(x, s.y, s.w, s.h);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.strokeRect(x + 1, s.y + 1, s.w - 2, s.h - 2);
      if (s.k === 'b') { ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(x + 6, s.y + 6); ctx.lineTo(x + s.w - 6, s.y + s.h - 6); ctx.moveTo(x + s.w - 6, s.y + 6); ctx.lineTo(x + 6, s.y + s.h - 6); ctx.stroke(); }
      ctx.restore();
      if (s.k === 'p') { ctx.globalCompositeOperation = 'lighter'; for (let i = 0; i < 2; i++) drawGlow(x + 30 + i * (s.w - 60), s.y + s.h + 6, 10 + Math.random() * 4, '#ff8a3d', 0.8); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
    }
  }
}

function drawHazards() {
  for (const h of hazards) {
    const x = h.x - cam; if (x > W + 50 || x + h.w < -50) continue;
    if (h.k === 'spike') {
      ctx.globalCompositeOperation = 'lighter'; drawGlow(x + h.w / 2, h.y + h.h, h.w * 0.8, '#ff2040', 0.35 + beatPulse * 0.3); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      for (let i = 0; i < h.n; i++) {
        const sx = x + i * 30;
        ctx.fillStyle = '#2a0010'; ctx.beginPath(); ctx.moveTo(sx, h.y + h.h); ctx.lineTo(sx + 15, h.y); ctx.lineTo(sx + 30, h.y + h.h); ctx.closePath(); ctx.fill();
        ctx.save(); ctx.shadowColor = '#ff2040'; ctx.shadowBlur = 10; ctx.strokeStyle = '#ff4060'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      }
    } else {
      const y = h.y + Math.sin(T * 4 + h.ph) * 6;
      ctx.save(); ctx.translate(x + h.w / 2, y + h.h / 2);
      ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 40, '#ffb020', 0.4); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      ctx.fillStyle = '#2a1500'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 12, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ffb020'; ctx.lineWidth = 2; ctx.stroke();
      // 회전 프로펠러
      ctx.strokeStyle = 'rgba(255,220,150,0.7)'; ctx.lineWidth = 2; const pr = Math.cos(T * 40) * 16;
      ctx.beginPath(); ctx.moveTo(-pr, -16); ctx.lineTo(pr, -16); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, -16); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter'; drawGlow(-6, 0, 8, '#ff2040', 1); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      // 스캔 빔
      ctx.fillStyle = `rgba(255,60,40,${0.12 + 0.1 * Math.sin(T * 10)})`; ctx.beginPath(); ctx.moveTo(-8, 10); ctx.lineTo(8, 10); ctx.lineTo(22, GY - y - h.h / 2); ctx.lineTo(-22, GY - y - h.h / 2); ctx.fill();
      ctx.restore();
    }
  }
  // orbs
  ctx.globalCompositeOperation = 'lighter';
  for (const o of orbs) {
    const x = o.x - cam; if (x < -30 || x > W + 30) continue;
    const y = o.y + Math.sin(T * 4 + o.ph) * 5;
    if (o.got) { const k = o.gotT / 0.3; drawGlow(x, y - k * 30, 20 * (1 - k) + 4, '#ffd166', 1 - k); continue; }
    drawGlow(x, y, 18, '#ffd166', 0.6);
    ctx.save(); ctx.translate(x, y); ctx.scale(Math.cos(T * 4 + o.ph), 1); ctx.globalAlpha = 1; ctx.fillStyle = '#fff4c2';
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 0); ctx.lineTo(0, 9); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

function drawCube(x, yBottom, rot, sq, slide, alpha = 1, ghost = false) {
  const h = slide ? 22 : 38, w = slide ? 46 : 38;
  const sx = 1 - sq * 0.4, sy = 1 + sq * 0.5;
  ctx.save(); ctx.translate(x, yBottom - h / 2 * sy); ctx.scale(sx, sy); if (!slide) ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  if (ghost) { ctx.strokeStyle = '#ff4fd8'; ctx.lineWidth = 2; ctx.strokeRect(-w / 2, -h / 2, w, h); ctx.restore(); return; }
  ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 44, '#7ff3ff', 0.5 + beatPulse * 0.3); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, '#d9fdff'); g.addColorStop(0.4, '#22d3ee'); g.addColorStop(1, '#5b21b6');
  ctx.fillStyle = g; ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(-w / 2 + 1, -h / 2 + 1, w - 2, h - 2);
  ctx.fillStyle = '#0a0420'; ctx.fillRect(-w / 2 + 7, -h / 2 + 7, w - 14, h - 14);
  ctx.fillStyle = '#7ff3ff'; // 얼굴
  const ey = slide ? -2 : -4; ctx.fillRect(2, ey, 6, 6); ctx.fillRect(-8, ey, 6, 6);
  ctx.fillStyle = '#ff4fd8'; ctx.fillRect(-6, ey + 10, 12, 3);
  ctx.restore(); ctx.globalAlpha = 1;
}

function drawPlayer() {
  const p = player; if (!p || p.dead) return;
  for (let i = 0; i < trail.length; i += 2) { const t = trail[i]; drawCube(t.x - cam, t.y + (t.slide ? 11 : 19), t.rot, 0, t.slide, (i / trail.length) * 0.35, true); }
  drawCube(PX, p.y, p.rot, p.sq, p.slide);
}

function drawFx() {
  for (const pc of pieces) { ctx.save(); ctx.translate(pc.x, pc.y); ctx.rotate(pc.rot); ctx.globalAlpha = Math.min(1, pc.life); ctx.fillStyle = pc.s && Math.floor(pc.x) % 2 ? '#7ff3ff' : '#ff4fd8'; ctx.fillRect(-pc.s / 2, -pc.s / 2, pc.s, pc.s); ctx.restore(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.t === 's') { ctx.globalAlpha = Math.min(1, k * 1.5); ctx.strokeStyle = p.col; ctx.lineWidth = p.size; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke(); }
    else if (p.t === 'line') { ctx.globalAlpha = 0.25 * k; ctx.strokeStyle = p.col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.size, p.y); ctx.stroke(); }
    else drawGlow(p.x, p.y, p.size * (0.3 + k), p.col, k);
  }
  for (const r of rings) { const k = r.life / r.max; ctx.globalAlpha = k; ctx.strokeStyle = r.col; ctx.lineWidth = Math.max(0.5, r.w * k); ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const age = p.max - p.life, s = age < 0.25 ? ease.outBack(age / 0.25) : 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s); ctx.globalAlpha = Math.min(1, p.life / p.max * 3);
    ctx.font = `900 ${p.size}px ${F}`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,0,30,0.7)'; ctx.strokeText(p.text, 0, 0); ctx.fillStyle = p.col; ctx.fillText(p.text, 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,220,150,0.75)'; ctx.font = `700 10px ${F}`; ctx.fillText('DISTANCE', 18, 24);
  ctx.font = `900 28px ${F}`; ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffb020'; ctx.shadowBlur = 12;
  ctx.fillText(meters() + 'm', 18, 54); ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'lighter'; drawGlow(26, 74, 10, '#ffd166', 0.8); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.font = `700 14px ${F}`; ctx.fillStyle = '#ffd166'; ctx.fillText('× ' + orbCount, 40, 79);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,220,150,0.75)'; ctx.font = `700 10px ${F}`; ctx.fillText('SCORE', W - 18, 24);
  ctx.font = `900 24px ${F}`; ctx.fillStyle = '#fff'; ctx.fillText(scoreNow().toLocaleString(), W - 18, 52);
  ctx.font = `500 10px ${F}`; ctx.fillStyle = 'rgba(255,220,150,0.6)'; ctx.fillText('BEST ' + Math.max(best, scoreNow()).toLocaleString(), W - 18, 68);
  // speed meter
  const k = (speed - 430) / (1080 - 430);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(W - 118, 78, 100, 4);
  const sg = ctx.createLinearGradient(W - 118, 0, W - 18, 0); sg.addColorStop(0, '#7ff3ff'); sg.addColorStop(1, '#ff2f7a');
  ctx.fillStyle = sg; ctx.fillRect(W - 118, 78, 100 * k, 4);
  ctx.font = `700 9px ${F}`; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('SPEED', W - 18, 94);
}

function drawBanner() {
  if (!banner) return;
  const t = banner.t, k = clamp(t / 0.4, 0, 1), out = clamp((t - 1.3) / 0.5, 0, 1);
  ctx.save(); ctx.translate(W / 2, H * 0.3); const s = ease.outElastic(k) * (1 + out); ctx.scale(s, s); ctx.globalAlpha = 1 - out;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${Math.min(64, W / 8)}px ${F}`;
  ctx.shadowColor = '#ffb020'; ctx.shadowBlur = 24; ctx.fillStyle = '#fff'; ctx.fillText(banner.text, 0, 0); ctx.shadowBlur = 0;
  ctx.font = `700 15px ${banner.sub.match(/[가-힣]/) ? FK : F}`; ctx.fillStyle = '#ffe08a'; ctx.fillText(banner.sub, 0, 42);
  ctx.restore(); ctx.globalAlpha = 1;
}

function drawTitle() {
  const t = stateT, title = 'NEON DASH', sz = Math.min(90, W / 7.5);
  ctx.font = `900 ${sz}px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const chars = [...title], ws = chars.map(c => ctx.measureText(c).width + sz * 0.04), total = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2; const y = H * 0.24;
  const g = ctx.createLinearGradient(0, y - sz / 2, 0, y + sz / 2); g.addColorStop(0, '#fff6c2'); g.addColorStop(0.5, '#ffb020'); g.addColorStop(1, '#ff2f7a');
  chars.forEach((c, i) => {
    const k = clamp((t - i * 0.06) / 0.5, 0, 1), hop = Math.max(0, Math.sin(T * 4 - i * 0.6)) * 14;
    ctx.save(); ctx.translate(x + ws[i] / 2 - (1 - ease.outCubic(k)) * W, y - hop); ctx.transform(1, 0, -0.15, 1, 0, 0);
    ctx.globalAlpha = k; ctx.shadowColor = '#ff2f7a'; ctx.shadowBlur = 26; ctx.fillStyle = g; ctx.fillText(c, 0, 0); ctx.restore();
    x += ws[i];
  });
  ctx.globalAlpha = clamp(t - 0.7, 0, 1);
  ctx.font = `700 ${Math.min(17, W / 26)}px ${FK}`; ctx.fillStyle = '#ffe08a'; ctx.fillText('신 스 웨 이 브   러 너', W / 2, y + sz * 0.8);
  // 데모 큐브
  const jy = Math.abs(Math.sin(T * 3)) * 90;
  drawCube(W / 2, GY - jy, T * 5, 0, false);
  if (t > 1.2) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 5); ctx.font = `900 ${Math.min(22, W / 20)}px ${FK}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('클릭 또는 SPACE 로 시작', W / 2, H * 0.84); }
  ctx.globalAlpha = 0.8; ctx.font = `500 13px ${FK}`; ctx.fillStyle = '#ffd6f0'; ctx.textAlign = 'center';
  ctx.fillText('점프: SPACE · ↑ · 클릭 (2단 점프 가능)    슬라이드: ↓ · S · 우클릭    소리: M', W / 2, H * 0.91);
  ctx.fillText('터치: 화면 오른쪽 = 점프, 왼쪽 길게 = 슬라이드', W / 2, H * 0.91 + 20);
  if (best > 0) { ctx.font = `700 13px ${F}`; ctx.fillStyle = '#ffd166'; ctx.fillText('BEST  ' + best.toLocaleString(), W / 2, y + sz * 0.8 + 30); }
  ctx.globalAlpha = 1;
}

function drawOver() {
  const t = stateT;
  ctx.fillStyle = `rgba(10,0,20,${Math.min(0.65, t)})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const k = clamp(t / 0.6, 0, 1);
  ctx.save(); ctx.translate(W / 2, H * 0.32); ctx.scale(ease.outElastic(k), ease.outElastic(k));
  ctx.font = `900 ${Math.min(66, W / 9)}px ${F}`; ctx.shadowColor = '#ff2f7a'; ctx.shadowBlur = 30; ctx.fillStyle = '#ffb020'; ctx.fillText('CRASHED!', 0, 0); ctx.restore(); ctx.shadowBlur = 0;
  if (t > 0.5) {
    const k2 = clamp((t - 0.5) / 0.8, 0, 1); ctx.globalAlpha = k2;
    const cols = [['DISTANCE', meters() + 'm'], ['ORBS', orbCount + ''], ['SCORE', Math.floor(scoreNow() * ease.outCubic(k2)).toLocaleString()]];
    cols.forEach(([a, b], i) => { const x = W / 2 + (i - 1) * Math.min(180, W * 0.3); ctx.font = `700 11px ${F}`; ctx.fillStyle = '#ffd6f0'; ctx.fillText(a, x, H * 0.48); ctx.font = `900 30px ${F}`; ctx.fillStyle = '#fff'; ctx.fillText(b, x, H * 0.48 + 32); });
    if (newRecord && k2 >= 1) { ctx.font = `900 22px ${F}`; ctx.fillStyle = `hsl(${(T * 200) % 360},100%,65%)`; ctx.fillText('NEW RECORD!', W / 2, H * 0.48 + 86); }
  }
  if (t > 1.2) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 5); ctx.font = `900 20px ${FK}`; ctx.fillStyle = '#fff'; ctx.fillText('클릭 또는 SPACE 로 다시 달리기', W / 2, H * 0.8); }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  if (shakeAmt > 0.1) ctx.translate(rand(-1, 1) * shakeAmt, rand(-1, 1) * shakeAmt);
  drawSky();
  if (state === 'title') {
    ctx.fillStyle = '#0a0218'; ctx.fillRect(0, GY, W, H - GY);
    solids = [{ x: cam - 100, w: W + 200, y: GY, h: H, k: 'g' }]; drawFloor(); solids = [];
    drawFx(); ctx.restore(); drawTitle();
  } else {
    drawFloor(); drawHazards(); drawPlayer(); drawFx();
    ctx.restore();
    drawBanner(); drawHUD();
    if (state === 'over') drawOver();
  }
  if (flashA > 0) { ctx.globalAlpha = Math.min(1, flashA); ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (paused) {
    ctx.fillStyle = 'rgba(10,0,20,0.6)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 46px ${F}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2 - 10);
    ctx.font = `500 15px ${FK}`; ctx.fillStyle = '#ffd6f0'; ctx.fillText('P 키 또는 클릭으로 계속', W / 2, H / 2 + 32);
  }
  if (muted) { ctx.textAlign = 'right'; ctx.font = `700 10px ${F}`; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillText('MUTED', W - 14, H - 10); }
}

resize();
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
